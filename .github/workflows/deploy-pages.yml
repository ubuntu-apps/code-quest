# Build and deploy CodeQuest to GitHub Pages
name: Deploy CodeQuest to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-codequest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Lint and tests gate the deploy, so a broken build never goes live.
      - name: Lint, test, and build
        run: npm run check

      # Runs every Python challenge's solution, starter and empty code (see scripts/check-curriculum.mjs).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check lesson content
        run: |
          # Pyodide 0.27.2 ships pandas 2.2; match it so the check sees what the app runs.
          pip install "pandas==2.2.*"
          npm run check:content

      # Runs every R challenge's solution, starter and typed-in answer in webR (see scripts/r-curriculum/check-core.mjs).
      # webR isn't an app dependency (the app loads it from a CDN), so it is installed here, at the version in src/runtimeVersions.ts.
      - name: Check R lesson content
        run: |
          npm install --no-save --no-audit --no-fund webr@0.4.2
          npm run check:r

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
