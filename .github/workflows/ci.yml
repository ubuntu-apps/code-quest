name: CodeQuest CI

# Pull requests only: pushes to main run the same checks in deploy-pages.yml before deploying.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: codequest-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint, test, and build
        run: npm run check

      # Runs every Python challenge's solution, starter and empty code (see scripts/check-curriculum.mjs).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check lesson content
        run: |
          # Pyodide 0.27.2 ships pandas 2.2; match it so the check sees what the app runs.
          pip install "pandas==2.2.*"
          npm run check:content

      # Runs every R challenge's solution, starter and typed-in answer in webR (see scripts/r-curriculum/check-core.mjs).
      # webR isn't an app dependency (the app loads it from a CDN), so it is installed here, at the version in src/runtimeVersions.ts.
      - name: Check R lesson content
        run: |
          npm install --no-save --no-audit --no-fund webr@0.4.2
          npm run check:r
